name: Flight Watch

on:
  schedule:
    # Every 5 minutes. This repo is PUBLIC, so GitHub Actions minutes are
    # free and unlimited here — on a private repo this interval would
    # cost real money (each run is billed as a full minute regardless of
    # actual runtime, and 5-minute polling adds up to ~8,700 min/month,
    # well past the 2,000 free minutes private repos get).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
    # ^ lets you trigger a manual test run from the Actions tab any time.

permissions:
  contents: write
  # Needed so this workflow can commit the updated flight_watch_state.json
  # back to the repo (that's how "don't re-alert on the same plane for 30
  # minutes" survives between runs, since each run starts from a fresh
  # checkout with no other disk state).

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Pulled from this repo's encrypted secrets (Settings -> Secrets and
      # variables -> Actions), never hardcoded, since this repo is public.
      FLIGHTWATCH_LAT: ${{ secrets.FLIGHTWATCH_LAT }}
      FLIGHTWATCH_LON: ${{ secrets.FLIGHTWATCH_LON }}
      FLIGHTWATCH_NTFY_TOPIC: ${{ secrets.FLIGHTWATCH_NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - name: Run flight watch check
        run: python3 flight_watch.py

      - name: Commit updated state if changed
        run: |
          git config user.name "flight-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- flight_watch_state.json; then
            git add flight_watch_state.json
            git commit -m "Update alert state"
            git push
          else
            echo "No state change, nothing to commit."
          fi
